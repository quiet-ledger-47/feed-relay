name: parts
on:
  schedule:
    - cron: "7 */4 * * *"   # starts a ~5.5h in-job loop (scan every 15 min); GitHub's own */15 cron was firing only every 4-6h
    - cron: "5 12 * * *"    # board fallback (the loop also posts the board once a day after 12:00 UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: loop, scan or board
        default: board
permissions:
  contents: read
concurrency:
  group: parts
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v5
        with:
          path: state
          key: p-${{ github.run_id }}
          restore-keys: p-
      - name: Run
        env:
          PARTS_HOOK: ${{ secrets.PARTS_HOOK }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '5 12 * * *' && 'board') || 'loop' }}
        run: |
          mkdir -p state
          board() { m="state/board-$(date -u +%Y%m%d)"; [ -f "$m" ] && return 0; python3 parts.py board && touch "$m"; }
          if [ "$MODE" = loop ]; then
            end=$(( $(date +%s) + 330*60 ))
            while [ "$(date +%s)" -lt "$end" ]; do
              [ "$(date -u +%H)" -ge 12 ] && { board || true; }
              python3 parts.py scan || echo "scan failed, retry next cycle"
              sleep 900
            done
          elif [ "$MODE" = board ]; then board
          else python3 parts.py "$MODE"; fi
      - uses: actions/cache/save@v5
        if: always()
        with:
          path: state
          key: p-${{ github.run_id }}
