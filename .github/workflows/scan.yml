name: scan
on:
  schedule:
    - cron: "1 */4 * * *"   # starts a ~5.5h in-job loop (deals every 15 min); GitHub's own */15 cron was firing only every 4-6h
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v5
        with:
          path: state
          key: s-${{ github.run_id }}
          restore-keys: s-
      - name: Run
        env:
          FEED_CONFIG: ${{ secrets.FEED_CONFIG }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: |
          end=$(( $(date +%s) + 330*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            python3 relay.py deals || echo "deals failed, retry next cycle"
            sleep 900
          done
      - uses: actions/cache/save@v5
        if: always()
        with:
          path: state
          key: s-${{ github.run_id }}
